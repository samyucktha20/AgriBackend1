server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: project-kisan-backend
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:kisandb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Security (disable for development)
  security:
    user:
      name: admin
      password: admin123

# Firebase Configuration
firebase:
  database:
    url: https://project-kisan-default-rtdb.firebaseio.com
  config:
    path: firebase-service-account.json

# Application Configuration
kisan:
  app:
    name: Project Kisan
    version: 1.0.0
    description: AI-powered agricultural assistant
  
  # External API Configuration (mock for now)
  api:
    market-data:
      url: https://api.data.gov.in/resource
    weather:
      url: https://api.openweathermap.org/data/2.5
    government-schemes:
      url: https://api.india.gov.in
  
  # AI Service Configuration (will be updated during hackathon)
  ai:
    vertex:
      project-id: your-project-id
      location: us-central1
    gemini:
      model: gemini-pro-vision

# Logging Configuration
logging:
  level:
    com.projectkisan: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always