# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:kisandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.projectkisan=DEBUG
logging.level.org.springframework.web=DEBUG

# Application Configuration
kisan.app.name=Project Kisan
kisan.app.version=1.0.0
kisan.app.description=AI-powered agricultural assistant

# External API Configuration (mock for now)
kisan.api.market-data.url=https://api.data.gov.in/resource
kisan.api.weather.url=https://api.openweathermap.org/data/2.5
kisan.api.government-schemes.url=https://api.india.gov.in

# AI Service Configuration (will be updated during hackathon)
kisan.ai.vertex.project-id=your-project-id
kisan.ai.vertex.location=us-central1
kisan.ai.gemini.model=gemini-pro-vision